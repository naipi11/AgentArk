[package]
name = "agentark-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "agentark_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "agentark-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
agentark-app = { path = "../../../crates/app" }
agentark-adapter-codex = { path = "../../../crates/adapters/codex" }
agentark-adapter-sdk = { path = "../../../crates/adapter-sdk" }
agentark-cas = { path = "../../../crates/cas" }
agentark-index = { path = "../../../crates/index" }
agentark-security = { path = "../../../crates/security" }
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tracing.workspace = true
uuid.workspace = true
directories.workspace = true
