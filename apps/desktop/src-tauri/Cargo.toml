[package]
name = "agentark-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "agentark_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "agentark-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
agentark-app = { path = "../../../crates/app" }
agentark-bundle = { path = "../../../crates/bundle" }
agentark-audit = { path = "../../../crates/audit" }
agentark-canonical = { path = "../../../crates/canonical" }
agentark-watch = { path = "../../../crates/watch" }
agentark-adapter-codex = { path = "../../../crates/adapters/codex" }
agentark-adapter-claude = { path = "../../../crates/adapters/claude" }
agentark-adapter-hermes = { path = "../../../crates/adapters/hermes" }
agentark-adapter-openclaw = { path = "../../../crates/adapters/openclaw" }
agentark-adapter-opencode = { path = "../../../crates/adapters/opencode" }
agentark-adapter-grok = { path = "../../../crates/adapters/grok" }
agentark-adapter-sdk = { path = "../../../crates/adapter-sdk" }
agentark-cas = { path = "../../../crates/cas" }
agentark-index = { path = "../../../crates/index" }
agentark-security = { path = "../../../crates/security" }
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tracing.workspace = true
uuid.workspace = true
directories.workspace = true
