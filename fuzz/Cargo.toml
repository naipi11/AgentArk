[package]
name = "agentark-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys.workspace = true
agentark-security = { path = "../crates/security" }
agentark-adapter-codex = { path = "../crates/adapters/codex" }

[[bin]]
name = "codex_jsonl"
path = "fuzz_targets/codex_jsonl.rs"
test = false
doc = false
bench = false

[[bin]]
name = "path_policy"
path = "fuzz_targets/path_policy.rs"
test = false
doc = false
bench = false
