name: ci
on:
  pull_request:
  push:
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev \
            libgtk-3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo install --locked cargo-audit --version 0.22.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --doc
      - run: cargo test -p agentark-desktop
      - run: cargo deny check
      - run: cargo audit
      - run: pwsh -File ci/check-security-crate-majors.ps1
      - run: pwsh -File ci/enforce-search-benchmark.ps1
      - run: pnpm --dir apps/desktop test
      - run: pnpm --dir apps/desktop build
      - run: pwsh -File ci/check-no-secret-canaries.ps1
      - run: pwsh -File ci/check-no-forbidden-codex-methods.ps1

  network-silence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - run: bash ci/network-silence.sh
