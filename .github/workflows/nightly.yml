name: nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  fuzz-and-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-20
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev \
            libgtk-3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf
      - run: cargo install --locked cargo-fuzz --version 0.13.2
      - name: Run codex JSONL fuzz target
        run: cargo fuzz run codex_jsonl -- -max_total_time=900
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-08-20
      - name: Run path policy fuzz target
        run: cargo fuzz run path_policy -- -max_total_time=900
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-08-20
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo install --locked cargo-audit --version 0.22.2
      - run: cargo deny check
      - run: cargo audit
      - run: pwsh -File ci/check-security-crate-majors.ps1
      - run: pwsh -File ci/enforce-search-benchmark.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/desktop test
      - run: pnpm --dir apps/desktop build
